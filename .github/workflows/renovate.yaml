name: Renovate
on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches: [main]
  workflow_dispatch:
  # Renovate only automerges while it runs. Running again whenever a check
  # workflow finishes on one of its branches lets a version update merge
  # minutes after its tests turn green, not at the next scheduled run.
  workflow_run:
    workflows: [test, docker, pr-policy]
    types: [completed]
    branches: ['renovate/**']
# One run at a time; a burst of triggers collapses into one queued run that
# still sees the latest check results. Fork-triggered workflow_run events (their
# job is skipped below) get their own group, so they cannot displace that run.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name != github.repository && format('renovate-ignored-{0}', github.run_id) || 'renovate' }}
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
jobs:
  renovate:
    # A fork PR can name its branch renovate/*; only this repository's
    # branches belong to Renovate. Nothing from the triggering run is used.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          # Renovate owns renovate/* branches. Pushing manual commits there
          # makes Renovate intentionally stop updating that branch; recover via
          # the Dependency Dashboard's rebase/retry checkbox instead.
          # RENOVATE_TOKEN must be a PAT that can BOTH push branches AND open
          # pull requests. Symptom of an under-scoped token: Renovate pushes
          # renovate/* branches but opens zero PRs (and may log "Error updating
          # branch: update failure"). Required scopes:
          #   - classic PAT: `repo` + `workflow`, or
          #   - fine-grained PAT (this repo): Contents RW, Pull requests RW,
          #     Workflows RW.
          # `workflow` is needed because config:best-practices +
          # pinGitHubActionDigests let Renovate edit .github/workflows/**.
          # Verify the PR flow via the Dependency Dashboard issue Renovate opens.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          # A dedicated author lets Renovate distinguish its own commits from
          # manual commits made by the PAT owner.
          RENOVATE_GIT_AUTHOR: Renovate Bot <bot@renovateapp.com>
          RENOVATE_EXTENDS: config:best-practices,customManagers:dockerfileVersions,customManagers:helmChartYamlAppVersions,helpers:pinGitHubActionDigests
          RENOVATE_AUTODISCOVER: true
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository }}
          RENOVATE_CONFIG_MIGRATION: true
          RENOVATE_AUTOMERGE: true
          RENOVATE_BUMP_VERSION: patch
          # Wait for the status checks (test/helm/build, plus the gates job
          # that a verified Renovate update passes without review records)
          # before automerging, so a failing dependency bump is never merged.
          RENOVATE_IGNORE_TESTS: false
          # Renovate merges itself, re-run by the workflow_run trigger. GitHub's
          # native auto-merge would wait only for the ruleset's required checks
          # (test, gates), not for helm and the docker build.
          RENOVATE_PLATFORM_AUTOMERGE: false
          # 'auto' lets Renovate refresh/rebase its PR branches so they pick up
          # the latest target version and re-run required checks. 'never' froze
          # PRs (no version bump, no check re-run), which blocked automerge.
          RENOVATE_REBASE_WHEN: auto
          RENOVATE_SEMANTIC_COMMITS: disabled
#         LOG_LEVEL: debug
#         RENOVATE_DRY_RUN: full
